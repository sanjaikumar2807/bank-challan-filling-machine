version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: bank_challan_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bank_challan
      MYSQL_USER: challan_user
      MYSQL_PASSWORD: challan_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bank_challan_network

  # Django Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_challan_backend
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DATABASE_HOST=db
      - DATABASE_NAME=bank_challan
      - DATABASE_USER=challan_user
      - DATABASE_PASSWORD=challan_password
      - DATABASE_PORT=3306
      - SECRET_KEY=your-production-secret-key-here
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      - db
    networks:
      - bank_challan_network
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn bank_challan.wsgi:application --bind 0.0.0.0:8000
      "

  # Nginx Web Server (for serving frontend)
  web:
    image: nginx:alpine
    container_name: bank_challan_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./index.html:/usr/share/nginx/html/index.html
      - ./index_7inch.html:/usr/share/nginx/html/index_7inch.html
      - ./css:/usr/share/nginx/html/css
      - ./js:/usr/share/nginx/html/js
      - ./assets:/usr/share/nginx/html/assets
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - bank_challan_network

volumes:
  mysql_data:
    driver: local

networks:
  bank_challan_network:
    driver: bridge
